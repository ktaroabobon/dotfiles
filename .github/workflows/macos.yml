name: macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Homebrew / oh-my-zsh / cobalt2 / powerline-fonts のインストーラは
    # すべて master 追従のため、リポジトリを変更しなくても壊れる。
    # 週次で回して、壊れたことに PR より先に気付けるようにする。
    - cron: '0 21 * * 0'  # 毎週月曜 06:00 JST

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # 既定の `bash -e` は pipefail が無く、パイプの先頭で落ちても成功扱いになる
    shell: bash -euo pipefail {0}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  macos-test:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v7
      with:
        # curl | bash のインストーラを走らせるため、トークンを .git に残さない
        persist-credentials: false

    - name: Run complete setup
      run: make all
      timeout-minutes: 30

    # 以降の検証は、途中が落ちても全部の結果が見えるように always() で回す

    - name: Check brew installation
      if: always()
      run: |
        which brew
        brew --version
        # CI では brew.sh が cask / mas を除外して bundle する。
        # check も同じフィルタを掛けた Brewfile に対して行う
        # (フル Brewfile に対して check すると構造的に必ず missing になり、
        #  検証として成立しない)
        #
        # --no-upgrade は install 側 (brew.sh) と条件を揃えるために要る。
        # 付けないと「入っているが古い」だけの formula まで未充足と判定され、
        # ランナーにプリインストールされた git / gh / wget で必ず落ちる。
        # --verbose は落ちたときに何が足りないかをログに残すため。
        tmp_brewfile=$(mktemp)
        grep -Ev '^[[:space:]]*(cask|mas)[[:space:]]' .bin/darwin/Brewfile > "$tmp_brewfile"
        brew bundle check --no-upgrade --verbose --file="$tmp_brewfile"
        rm -f "$tmp_brewfile"

    - name: Check cask / mas entries still exist upstream
      if: always()
      # 実インストールはしない (認証と容量が要る)。upstream でのリネームや
      # 削除だけを検出する。Brewfile には過去に tailscale -> tailscale-app、
      # codex の formula -> cask 移行の実績がある
      run: |
        status=0
        while IFS= read -r name; do
          if brew info --cask "$name" > /dev/null 2>&1; then
            echo "✅ cask $name"
          else
            echo "❌ cask $name が見つかりません"
            status=1
          fi
        done < <(sed -n 's/^cask "\([^"]*\)".*/\1/p' .bin/darwin/Brewfile)
        exit $status

    - name: Check symlinks created
      if: always()
      run: test/darwin/verify_links.sh

    - name: Check the repository is left clean
      if: always()
      # link.sh / cobalt2.sh はホーム側のファイルを書き換えるが、link 後の
      # ~/.zshrc 等はリポジトリへのシンボリックリンクなので、書き込むと
      # リポジトリ本体が変わってしまう
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "::error::make all の後に作業ツリーが変更されています"
          git status --porcelain
          git diff
          exit 1
        fi
        echo "✅ 作業ツリーはクリーンです"

    - name: Check cobalt2 theme installation
      if: always()
      run: |
        status=0

        if [ -d "$HOME/.oh-my-zsh" ]; then
          echo "✅ oh-my-zsh installed"
        else
          echo "❌ oh-my-zsh not found"
          status=1
        fi

        if [ -f "$HOME/.oh-my-zsh/themes/cobalt2.zsh-theme" ]; then
          echo "✅ cobalt2.zsh-theme installed"
        else
          echo "❌ cobalt2.zsh-theme not found"
          status=1
        fi

        if grep -q 'ZSH_THEME="cobalt2"' "$HOME/.zshrc"; then
          echo "✅ ZSH_THEME set to cobalt2"
        else
          echo "❌ ZSH_THEME not set to cobalt2"
          status=1
        fi

        if [ -f "$HOME/Downloads/cobalt2.itermcolors" ]; then
          echo "✅ cobalt2.itermcolors downloaded"
        else
          echo "❌ cobalt2.itermcolors not found"
          status=1
        fi

        exit $status

    - name: Check Powerline fonts installation
      if: always()
      # cobalt2.sh の `git clone https://github.com/powerline/fonts.git` が
      # 通ることの回帰テスト。リポジトリの .gitconfig には
      # `[url "git@github.com:"] insteadOf = https://github.com/` があるため、
      # 素直に clone すると CI では SSH 鍵が無く失敗する
      run: |
        fonts=$(find "$HOME/Library/Fonts" -maxdepth 1 -iname '*powerline*' 2>/dev/null)
        if [ -n "$fonts" ]; then
          echo "✅ Powerline フォントがインストールされています"
          echo "$fonts" | head -5
        else
          echo "❌ Powerline フォントが見つかりません"
          echo "   cobalt2.sh の fonts clone が失敗している可能性があります"
          exit 1
        fi

    - name: Load .zshrc
      if: always()
      run: test/darwin/load_rc.sh .zshrc

    - name: Load .zprofile
      if: always()
      run: test/darwin/load_rc.sh .zprofile

    - name: Summary
      if: always()
      run: |
        {
          echo "### macOS セットアップ結果"
          echo ""
          echo "| 項目 | 値 |"
          echo "| --- | --- |"
          echo "| runner | $(sw_vers -productVersion) / $(uname -m) |"
          echo "| zsh | $(command -v zsh || echo 'not found') |"
          echo "| brew | $(brew --version | head -1) |"
          echo "| theme | $(grep ZSH_THEME ~/.zshrc || echo 'not set') |"
        } >> "$GITHUB_STEP_SUMMARY"
